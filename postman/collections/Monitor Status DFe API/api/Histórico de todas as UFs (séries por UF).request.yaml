$kind: http-request
description: |
  Devolve, numa única chamada, as séries históricas de todas as UFs monitoradas para um documento e ambiente. UFs sem leituras na janela aparecem com lista vazia. Ideal para gráficos comparativos e dashboards externos.
url: "{{baseUrl}}/api/historico?horas=24&documento=nfe&tp_amb=1"
method: GET
headers:
  - key: CF-Turnstile-Token
    value: string
    disabled: false
    description: |
      Token do Cloudflare Turnstile. Exigido APENAS quando a proteção anti-bot está habilitada na instalação; sem chaves configuradas, o cabeçalho é ignorado.
  - key: Accept
    value: application/json
queryParams:
  - key: horas
    value: "24"
    disabled: false
    description: "Tamanho da janela em horas (1 a 720). Padrão: 24."
  - key: documento
    value: nfe
    disabled: false
    description: "Código do modelo (ex.: nfe). Padrão: primeiro modelo ativo."
  - key: tp_amb
    value: "1"
    disabled: false
    description: "Ambiente — 1 (produção) ou 2 (homologação). Padrão: 1."
settings: {}
examples: ./.resources/Histórico de todas as UFs (séries por UF).resources/examples
order: 3000
