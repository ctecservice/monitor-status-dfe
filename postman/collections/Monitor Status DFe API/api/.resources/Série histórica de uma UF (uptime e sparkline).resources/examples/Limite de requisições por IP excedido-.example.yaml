$kind: http-example
name: Limite de requisições por IP excedido.
request:
  url: "{{baseUrl}}/api/uf/:uf/historico?horas=24&documento=nfe&tp_amb=1"
  method: GET
  headers:
    - key: CF-Turnstile-Token
      value: string
      disabled: false
      description: |
        Token do Cloudflare Turnstile. Exigido APENAS quando a proteção anti-bot está habilitada na instalação; sem chaves configuradas, o cabeçalho é ignorado.
    - key: Accept
      value: application/json
  queryParams:
    horas: "24"
    documento: nfe
    tp_amb: "1"
  pathVariables:
    - key: uf
      value: MG
      disabled: false
      description: "(Required) Sigla da UF (ex.: MG). Inválida responde 404."
  body:
    type: text
    content: ""
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: Retry-After
      value: "60"
      disabled: false
      description: Segundos até poder tentar novamente.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "erro": "Limite de requisições excedido. Tente novamente em instantes."
      }
order: 5000
