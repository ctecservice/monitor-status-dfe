$kind: http-example
name: Células atuais com rótulos exibíveis.
request:
  url: "{{baseUrl}}/api/status"
  method: GET
  headers:
    - key: CF-Turnstile-Token
      value: string
      disabled: false
      description: |
        Token do Cloudflare Turnstile. Exigido APENAS quando a proteção anti-bot está habilitada na instalação; sem chaves configuradas, o cabeçalho é ignorado.
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "gerado_em": "2026-10-17T13:27:05.481561+00:00",
        "ambientes": [
          {
            "tp_amb": 1,
            "rotulo": "Producao"
          },
          {
            "tp_amb": 2,
            "rotulo": "Homologacao"
          }
        ],
        "celulas": [
          {
            "uf": "MG",
            "documento": "nfe",
            "tp_amb": 1,
            "estado": "operacional",
            "rotulo": "Operacional",
            "cor": "#22C55E",
            "cstat": "107",
            "t_med": 512,
            "response_time": 480,
            "coletado_em": "2026-10-17T13:27:05.481561+00:00",
            "erro": null
          }
        ]
      }
order: 1000
